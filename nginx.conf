server {
    listen 80;
    server_name navilet.ru www.navilet.ru;

    # Редирект HTTP → HTTPS
    location / {
        return 301 https://navilet.ru$request_uri;
    }

    # certbot webroot для продления сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name navilet.ru www.navilet.ru;
    root /usr/share/nginx/html;
    index index.html;

    # SSL — сертификаты монтируются как volume
    ssl_certificate     /etc/letsencrypt/live/navilet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navilet.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Редирект www → без www
    if ($host = www.navilet.ru) {
        return 301 https://navilet.ru$request_uri;
    }

    charset utf-8;

    # Gzip-сжатие (включая HTML)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        application/atom+xml application/ld+json
        image/svg+xml font/woff2 font/woff
        text/markdown;

    # Security-заголовки (глобально)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;

    # === 301-редиректы со старых/типовых URL на канонические якоря ===
    # Закрываем soft-404 для типовых поисковых паттернов и сохраняем входящие ссылки
    location = /pricing { return 301 https://navilet.ru/tarify; }
    location = /pricing/ { return 301 https://navilet.ru/tarify; }
    location = /price { return 301 https://navilet.ru/tarify; }
    location = /price/ { return 301 https://navilet.ru/tarify; }
    location = /prices { return 301 https://navilet.ru/tarify; }
    location = /tariffs { return 301 https://navilet.ru/tarify; }
    location = /tariff { return 301 https://navilet.ru/tarify; }
    location = /tarif { return 301 https://navilet.ru/tarify; }
    location = /tarifi { return 301 https://navilet.ru/tarify; }
    location = /demo { return 301 https://navilet.ru/#demo; }
    location = /demo/ { return 301 https://navilet.ru/#demo; }
    location = /features { return 301 https://navilet.ru/#features; }
    location = /features/ { return 301 https://navilet.ru/#features; }
    location = /vozmozhnosti { return 301 https://navilet.ru/#features; }
    location = /contact { return 301 https://navilet.ru/#cta; }
    location = /contacts { return 301 https://navilet.ru/#cta; }
    location = /kontakty { return 301 https://navilet.ru/#cta; }
    location = /about { return 301 https://navilet.ru/o-komande; }
    location = /o-nas { return 301 https://navilet.ru/o-komande; }
    location = /komanda { return 301 https://navilet.ru/o-komande; }
    location = /team { return 301 https://navilet.ru/o-komande; }
    location = /o-komandee { return 301 https://navilet.ru/o-komande; }
    location = /partners { return 301 https://navilet.ru/#partners; }
    location = /partnery { return 301 https://navilet.ru/#partners; }
    location = /events { return 301 https://navilet.ru/#events; }
    location = /meropriyatiya { return 301 https://navilet.ru/#events; }
    location = /integration { return 301 https://navilet.ru/integraciya-tourvisor; }
    location = /tourvisor { return 301 https://navilet.ru/integraciya-tourvisor; }
    location = /turagentstvam { return 301 https://navilet.ru/dlya-turagentstv; }
    location = /agentstvam { return 301 https://navilet.ru/dlya-turagentstv; }
    location = /agencies { return 301 https://navilet.ru/dlya-turagentstv; }
    location = /turoperatoram { return 301 https://navilet.ru/dlya-turoperatorov; }
    location = /operatoram { return 301 https://navilet.ru/dlya-turoperatorov; }
    location = /operators { return 301 https://navilet.ru/dlya-turoperatorov; }
    location = /cases { return 301 https://navilet.ru/keisy/mgp; }
    location = /case { return 301 https://navilet.ru/keisy/mgp; }
    location = /klienty { return 301 https://navilet.ru/keisy/mgp; }
    location = /clients { return 301 https://navilet.ru/keisy/mgp; }
    location = /keisy { return 301 https://navilet.ru/keisy/mgp; }
    location = /case-mgp { return 301 https://navilet.ru/keisy/mgp; }
    location = /case-studies { return 301 https://navilet.ru/keisy/mgp; }
    location = /mgp { return 301 https://navilet.ru/keisy/mgp; }
    location = /lk { return 301 https://lk.navilet.ru/; }
    location = /login { return 301 https://lk.navilet.ru/; }
    location = /signup { return 301 https://lk.navilet.ru/; }
    location = /register { return 301 https://lk.navilet.ru/; }
    location = /sign-up { return 301 https://lk.navilet.ru/; }

    # Кэш для _next/static
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Изображения, шрифты
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SEO-метаданные — короткий кэш и правильные content-type
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/xml; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /llms.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /llms-full.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Главное правило: пробуем точный URI, .html-вариант, директорию — иначе 404
    # БЕЗ fallback на /index.html — это устраняет soft-404 для произвольных путей.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Кастомная страница 404 (статический экспорт Next.js: /404.html)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
